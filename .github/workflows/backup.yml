name: Nightly database backup

# Atlas's free M0 tier takes no automatic backups, so this is the only copy of the
# applications, club logins and OTP records. One mongodump a night into a private S3 bucket,
# keeping 14 days.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   MONGO_URI            the connection string, including the database name
#   BACKUP_S3_BUCKET     bucket name, private
#   BACKUP_S3_PREFIX     key prefix, e.g. joinclub
#   BACKUP_S3_REGION     e.g. ap-south-1
#   BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY
#
# Restoring: docs/runbooks/restore.md. Test a restore before you need one.
on:
  schedule:
    # 02:30 UTC, which is 08:00 IST: quiet, and clear of the deploy window.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the MongoDB database tools
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools
      - name: mongodump to a compressed archive
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          mkdir -p dump
          # The database name comes from the URI, so one secret covers every environment.
          mongodump --uri="$MONGO_URI" --archive="dump/backup.archive.gz" --gzip
          echo "archive: $(du -h dump/backup.archive.gz | cut -f1)"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.BACKUP_S3_REGION }}
          aws-access-key-id: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      - name: Upload with today's date in the key
        env:
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
        run: |
          set -euo pipefail
          key="${PREFIX}/$(date -u +%Y-%m-%d)-backup.archive.gz"
          aws s3 cp dump/backup.archive.gz "s3://${BUCKET}/${key}" --storage-class STANDARD_IA
          echo "Uploaded s3://${BUCKET}/${key}"
      - name: Delete anything older than 14 days
        env:
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "14 days ago" +%Y-%m-%d)
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PREFIX/" --query 'Contents[].Key' --output text \
            | tr '\t' '\n' \
            | grep -E "^${PREFIX}/[0-9]{4}-[0-9]{2}-[0-9]{2}-backup\.archive\.gz$" \
            | while read -r key; do
                day=$(echo "$key" | sed -E "s|^${PREFIX}/([0-9-]+)-backup.*|\1|")
                if [[ "$day" < "$cutoff" ]]; then
                  echo "Deleting $key"
                  aws s3 rm "s3://${BUCKET}/${key}"
                fi
              done
